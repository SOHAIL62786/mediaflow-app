server {
    listen 80;
    # Pinned to the real domain, not a generic catch-all (server_name _;) —
    # that placeholder is what caused a real outage on 2026-09-20: certbot
    # had directly added an HTTPS server block here for this exact domain
    # at some point on the live VM, never reflected back into this repo
    # file. Deploying this file overwrote and destroyed that block, killing
    # HTTPS entirely (port 443 stopped listening). With server_name pinned
    # to the domain, certbot's nginx plugin can find this block again
    # (`sudo certbot install --cert-name sohailanalytics.online` or
    # `sudo certbot --nginx -d sohailanalytics.online`) and manages its own
    # HTTPS server block here going forward — which then WILL be reflected
    # in this file the next time it's pulled from the live VM and copied
    # back into the repo, so this can't silently regress again.
    server_name sohailanalytics.online;

    # Videos can be large — raise the upload limit (default is 1MB)
    client_max_body_size 2G;

    # Large uploads can take a while — give proxying generous timeouts
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # client_body_timeout (time nginx waits between chunks of an incoming
    # request body before giving up) and send_timeout (same, for chunks
    # nginx sends back to the client) both default to just 60s — too
    # short for a large video over a slow/unstable connection (mobile
    # networks especially). This is a separate setting from the
    # proxy_*_timeout pair above, which only govern the nginx<->backend
    # leg, not client<->nginx.
    client_body_timeout 600s;
    send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
