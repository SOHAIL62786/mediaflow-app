name: Deploy to VM

on:
  push:
    branches: [main]
    paths:
      - 'server.py'
      - 'static/**'
      - 'requirements.txt'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Add VM to known hosts
        run: ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync files to VM
        run: |
          rsync -avz \
            --exclude 'venv/' --exclude 'credentials/' --exclude 'mediaflow.env' \
            --exclude 'mediaflow.db' --exclude 'uploads/' --exclude 'mediaflow.service' \
            --exclude '.git/' --exclude '.github/' --exclude '__pycache__/' \
            ./ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/${{ secrets.VM_USER }}/mediaflow-app/

      - name: Restart service
        run: ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "sudo systemctl restart mediaflow"
