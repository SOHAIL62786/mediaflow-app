name: anthropic-wif-test

on:
  workflow_dispatch: {}

  schedule:
    - cron: '*/10 * * * *'
      timezone: 'Asia/Kolkata'

permissions:
  contents: read
  id-token: write

jobs:
  call-claude:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Claude through WIF
        uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            This is a Workload Identity Federation authentication test.

            Do not modify any files.

            Reply with exactly:

            CLAUDE_WIF_SUCCESS
          
          show_full_output: true

          anthropic_federation_rule_id: fdrl_016bp96oSQnAsdMkerbVZaDu
          anthropic_organization_id: 02f4c357-08f0-4472-b078-9aa4232e6650
          anthropic_service_account_id: svac_01LKaLd4VuxcQEPYbg8q8FeD
          anthropic_workspace_id: wrkspc_01UJjm5LH3w5DbundYuZ3EXR
